<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mã và hình · MATHTIKZ</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="chung/giao-dien.css"><link rel="stylesheet" href="chung/web.css"><script src="chung/cau-hinh.js"></script><script type="module" src="chung/fb.js"></script><script src="chung/dang-nhap.js"></script><link rel="stylesheet" href="chung/theme.css"></head><body data-trang="sua"><header id="thanh-tren"></header><div class="bo-cuc"><aside class="menu-trai"><strong>KHÔNG GIAN CỦA BẠN</strong><nav id="menu"></nav><div id="trang-thai-kho"></div></aside><main class="noi-dung"><div id="loi" hidden role="alert"></div><div class="dau-trang"><div><h1 id="tieu-de">Thêm mẫu TikZ</h1><p class="phu">Chỉ lưu mã hình; ảnh xem trước được build từ chính mã đó.</p></div><span class="nhan" id="trang-thai">Chưa lưu</span></div><div class="bieu-mau"><label>Tên hình<input id="title" class="o-nhap" maxlength="150" placeholder="Ví dụ: Chiếc thang dựa vào tường"></label><label>Loại hình<select id="kind" class="o-nhap"><option value="real">Hình thực tế</option><option value="basic">Hình toán cơ bản</option></select></label><label>Khối lớp<select id="grade" class="o-nhap"><option value="">Chưa gắn khối</option><option value="6">Khối 6</option><option value="7">Khối 7</option><option value="8">Khối 8</option><option value="9">Khối 9</option></select></label><label>Chủ đề<input id="topic" class="o-nhap" maxlength="100"></label><label>Từ khóa<input id="tags" class="o-nhap" maxlength="500" placeholder="thang, tường, góc nghiêng…"></label><label>Mô tả<input id="description" class="o-nhap" maxlength="1000"></label></div><div class="hai-cot"><section class="bang"><div class="tieu-de-bang">Mã TikZ<label class="nhap-tep">Nhập .tex<input id="tep" type="file" accept=".tex,text/plain"></label></div><textarea class="ma-tikz" id="source" aria-label="Mã TikZ" spellcheck="false"></textarea></section><section class="bang"><div class="tieu-de-bang">Ảnh xem trước <span class="mo" id="anh-trang-thai">Chưa build</span></div><div class="xem-truoc" id="preview">Bấm Build hình hoặc F5.</div></section></div><div class="hang-nut"><button class="nut chinh" id="build">Build hình (F5)</button><button class="nut nut-ai" id="ai-sua" title="Gửi mã và lỗi biên dịch cho AI đã chọn trong Cài đặt để sửa">AI sửa mã</button><button class="nut" id="hoan-tac-ai" hidden>Khôi phục mã trước khi AI sửa</button><button class="nut" id="nhap">Lưu nháp trên máy</button><button class="nut chinh" id="luu">Lưu vào kho</button><button class="nut" id="copy">Copy mã</button><button class="nut" id="tex">Tải .tex</button><button class="nut" id="anh" disabled>Tải ảnh</button></div></main></div><script src="chung/tikz.js"></script><script src="chung/kho-du-lieu.js"></script><script src="chung/ai.js"></script><script src="chung/khung-web.js"></script><script src="trang/sua-hinh.js"></script></body></html>
